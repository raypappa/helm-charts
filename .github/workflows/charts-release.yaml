name: "Charts: Release"

concurrency: helm-release

on:
  workflow_dispatch:
    inputs:
      charts:
        description: >
          Charts to release. Comma-separated string.
          Defaults to releasing everything.
        default: ""
        required: false

  push:
    branches:
      - main
    paths:
      - "charts/**"

env:
  HELM_VERSION: 3.11.2
jobs:
  prepare:
    name: Prepare data required for release
    runs-on: ubuntu-22.04
    outputs:
      libraryChartsToRelease: ${{ steps.filtered-charts.outputs.libraryCharts }}
      applicationChartsToRelease: ${{ steps.filtered-charts.outputs.applicationCharts }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Grab repository configuration
        id: repo-config
        shell: bash
        run: |
          echo "config=$(yq '.' '.ci/repo-config.yaml' -o json -I=0)" >> "$GITHUB_OUTPUT"

      - name: Get changed charts
        id: changed-charts
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          path: charts
          dir_names: true
          dir_names_exclude_current_dir: true
          dir_names_max_depth: 2
          json: true
          escape_json: false

      - name: Get specified charts
        id: specified-charts
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          INPUTS_CHARTS: ${{ inputs.charts }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const input = process.env.INPUTS_CHARTS ?? '';
            let charts;

            try {
              charts = JSON.parse(input);
            } catch (error) {
              // Fall back to comma-separated input for the existing dispatch shape.
              charts = input.split(',').map(chart => chart.trim()).filter(chart => chart.length > 0);
              if (charts.length === 0) {
                throw new Error("Workflow dispatch 'charts' input must be a non-empty JSON array or comma-separated list; specify at least one chart to release.");
              }
            }

            if (!Array.isArray(charts) || charts.length === 0) {
              throw new Error("Workflow dispatch 'charts' input must be a non-empty JSON array or comma-separated list; specify at least one chart to release.");
            }

            const cwd = process.cwd();
            charts.forEach((chart) => {
              if (typeof chart !== 'string') {
                throw new Error("Each requested chart must be a string path, for example 'lldap'.");
              }
              const normalizedChart = path.posix.normalize(chart);
              const hasDotSegment = chart.split('/').some(segment => segment === '.' || segment === '..');
              if (
                chart.length === 0 ||
                chart.startsWith('/') ||
                chart.endsWith('/') ||
                hasDotSegment ||
                normalizedChart !== chart
              ) {
                throw new Error(`Chart '${chart}' is not a canonical chart identifier; use a path such as 'lldap' without '.', '..', or duplicate separators.`);
              }
              const fullPath = `${cwd}/charts/${chart}`;
              if (!fs.existsSync(fullPath)) {
                throw new Error(`Chart '${chart}' does not exist in repository; specify a chart directory under 'charts/'.`);
              }
              if (!fs.lstatSync(fullPath).isDirectory()) {
                throw new Error(`Chart '${chart}' is not a valid directory; specify a chart directory under 'charts/'.`);
              }
            });

            core.setOutput('chartsToRelease', JSON.stringify(charts));

      - name: Filter out excluded charts
        id: filtered-charts
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          SPECIFIED_CHARTS: ${{ steps.specified-charts.outputs.chartsToRelease }}
          CHANGED_CHARTS: ${{ steps.changed-charts.outputs.all_modified_files }}
          REPO_SETTINGS: ${{ steps.repo-config.outputs.config }}
        with:
          script: |
            const SPECIFIED_CHARTS = process.env.SPECIFIED_CHARTS ?? '[]';
            const CHANGED_CHARTS = process.env.CHANGED_CHARTS ?? '[]';
            const REPO_SETTINGS = process.env.REPO_SETTINGS ?? '{}';

            const eventName = '${{ github.event_name }}';
            const repoSettings = JSON.parse(REPO_SETTINGS);

            const chartsInput = JSON.parse(eventName === 'workflow_dispatch' ? SPECIFIED_CHARTS : CHANGED_CHARTS);
            const excludedFromRelease = new Set(repoSettings['excluded-charts-release'] ?? []);
            const chartsToRelease = chartsInput.filter(chart => !excludedFromRelease.has(chart));
            const libraryCharts = chartsToRelease.filter(chart => chart.startsWith('library/'));
            const applicationCharts = chartsToRelease.filter(chart => !chart.startsWith('library/'));

            if (libraryCharts.length > 0 && applicationCharts.length > 0) {
              throw new Error(`Charts release selection mixes library charts (${libraryCharts.join(', ')}) and non-library charts (${applicationCharts.join(', ')}); run the workflow separately for each group.`);
            }

            console.log('Library charts to release:', JSON.stringify(libraryCharts, null, 2));
            console.log('Other charts to release:', JSON.stringify(applicationCharts, null, 2));
            core.setOutput('libraryCharts', JSON.stringify(libraryCharts));
            core.setOutput('applicationCharts', JSON.stringify(applicationCharts));
            console.log('Charts to release:', JSON.stringify(chartsToRelease, null, 2));

  release-library-charts:
    name: Release Library charts to GitHub pages
    uses: ./.github/workflows/charts-release-ghpages.yaml
    needs:
      - prepare
    with:
      charts: "${{ needs.prepare.outputs.libraryChartsToRelease }}"
    secrets: inherit

  tag-library-charts:
    name: Create git tags for library charts
    uses: ./.github/workflows/tag-charts.yaml
    needs:
      - prepare
      - release-library-charts
    with:
      charts: "${{ needs.prepare.outputs.libraryChartsToRelease }}"
    secrets: inherit

  release-application-charts:
    name: Release Application charts to GitHub pages
    uses: ./.github/workflows/charts-release-ghpages.yaml
    needs:
      - prepare
      - release-library-charts
    with:
      charts: "${{ needs.prepare.outputs.applicationChartsToRelease }}"
    secrets: inherit

  tag-application-charts:
    name: Create git tags for application charts
    uses: ./.github/workflows/tag-charts.yaml
    needs:
      - prepare
      - release-application-charts
    with:
      charts: "${{ needs.prepare.outputs.applicationChartsToRelease }}"
    secrets: inherit

  release-github-oci:
    name: Release Application charts to GitHub Container Registry
    uses: ./.github/workflows/charts-release-oci.yaml
    permissions:
      actions: read
      packages: write
      id-token: write
    needs:
      - prepare
      - release-library-charts
    with:
      charts: "${{ needs.prepare.outputs.applicationChartsToRelease }}"
    secrets: inherit
