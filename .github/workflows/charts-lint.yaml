name: "Charts: Lint"

on:
  workflow_call:
    inputs:
      checkoutCommit:
        required: true
        type: string
      baseCommit:
        required: true
        type: string
      isRenovatePR:
        required: true
        default: "false"
        type: string
      chartsToLint:
        description: >
          A JSON encoded array of charts to lint
        required: true
        type: string
      overrideDeps:
        description: >
          A JSON encoded array of dependencies to override before linting
        type: string
        required: false
        default: "[]"

env:
  HELM_VERSION: 3.11.2

jobs:
  lint-chart:
    if: ${{ inputs.chartsToLint != '[]' }}
    name: Lint chart
    strategy:
      matrix:
        chart: ${{ fromJSON(inputs.chartsToLint) }}
      fail-fast: false
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull
          fetch-depth: 0

      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.baseCommit }}
          path: default
          fetch-depth: 0

      - name: Get chart details for PR
        id: chart-details-pr
        env:
          CHART: ${{ matrix.chart }}
        run: |
          args=(
            "pull/charts/${CHART}"
            --validateChartYaml
          )
          if [[ "${{ inputs.isRenovatePR }}" != "true" ]]; then
            args+=(--requireChangelog)
          fi
          .ci/scripts/get-chart-details.sh "${args[@]}"

      - name: Get chart details for default branch
        id: chart-details-default
        env:
          CHART: ${{ matrix.chart }}
        run: |
          .ci/scripts/get-chart-details.sh \
            "default/charts/${CHART}" \
            --allowChartToNotExist

      - name: Check version update
        if: ${{ steps.chart-details-pr.outputs.version == steps.chart-details-default.outputs.version }}
        env:
          CHART: ${{ matrix.chart }}
          PR_VERSION: ${{ steps.chart-details-pr.outputs.version }}
          DEFAULT_VERSION: ${{ steps.chart-details-default.outputs.version }}
        run: |
          echo "::error::Chart '${CHART}' version has not been updated. PR version: ${PR_VERSION}, default branch version: ${DEFAULT_VERSION}." >&2
          exit 1

      - name: Install Kubernetes tools
        uses: yokawasa/action-setup-kube-tools@b16d49b2c459d33cf9d4c300a220ef0bcdbc730a # v0.14.0
        with:
          setup-tools: |
            helmv3
          helm: "${{ env.HELM_VERSION }}"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      - name: Override chart dependencies
        uses: ./.github/actions/override-chart-deps
        if: ${{ inputs.overrideDeps != '[]' }}
        with:
          chart: ${{ matrix.chart }}
          overrides: ${{ inputs.overrideDeps }}

      - name: Run chart-testing (lint)
        run: ct lint --config .ci/ct/ct.yaml --charts "charts/${{ matrix.chart }}"

  lint_success:
    needs:
      - lint-chart
    if: |
      always()
    name: Lint successful
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix status
        if: >-
          ${{
              (
                inputs.chartsToLint != '' && inputs.chartsToLint != '[]'
              ) &&
              (
                contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              )
          }}
        run: exit 1
