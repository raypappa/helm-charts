[tools]
"github:helm/chart-testing" = { version = "v3.15.0", exe = "ct" }
helm = "4.3.0"
pre-commit = { version = "4.6.2" }
"pypi:yamale" = { version = "6.1.0", extra = "ruamel" }
python = "3.15.2"
yamllint = "1.38.0"

[settings]
experimental = true
auto_install = true
lockfile = true
minimum_release_age = "3d"
pin = true

[settings.pipx]
uvx = true
